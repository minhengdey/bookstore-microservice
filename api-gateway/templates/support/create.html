{% extends "base.html" %}
{% load custom_filters %}

{% block title %}Tạo ticket hỗ trợ{% endblock %}

{% block content %}
<h2 class="section-title" style="margin-bottom: 20px;">Tạo ticket hỗ trợ</h2>

<div class="card">
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Tiêu đề *</label>
            <input type="text" name="subject" required placeholder="Ví dụ: Đơn hàng chưa nhận được">
        </div>
        <div class="form-group">
            <label>Liên quan đơn hàng (tuỳ chọn)</label>
            <select name="order_id">
                <option value="">— Không liên quan đơn hàng —</option>
                {% for order in orders %}
                <option value="{{ order.id }}">Đơn #{{ order.id }} — {{ order.total_amount|vnd }} ({{ order.status|vi_status }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Nội dung *</label>
            <textarea name="content" rows="6" required placeholder="Mô tả chi tiết vấn đề của bạn..."></textarea>
        </div>
        <div class="page-actions" style="margin-top: 0;">
            <button type="submit" class="btn btn-primary">Gửi ticket</button>
            <a href="/support/" class="btn btn-secondary">Huỷ</a>
        </div>
    </form>
</div>
{% endblock %}
