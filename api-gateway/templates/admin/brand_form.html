{% extends "admin_base.html" %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
    <h1 style="margin: 0; font-size: 1.8rem;">Thêm Thương hiệu</h1>
    <a href="/admin/brands/" class="btn btn-secondary">Quay lại</a>
</div>

<div class="card" style="max-width: 600px;">
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Tên thương hiệu <span style="color: red;">*</span></label>
            <input type="text" name="name" class="form-control" required placeholder="Ví dụ: Apple, Samsung...">
        </div>
        
        <div class="form-group">
            <label>Mô tả</label>
            <textarea name="description" class="form-control" rows="4" placeholder="Thông tin về thương hiệu này..."></textarea>
        </div>
        
        <div style="margin-top: 24px;">
            <button type="submit" class="btn btn-primary">Lưu Thương hiệu</button>
        </div>
    </form>
</div>
{% endblock %}
