{% extends "admin_base.html" %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
    <h1 style="margin: 0; font-size: 1.8rem;">{% if product %}Sửa Sản phẩm{% else %}Thêm Sản phẩm{% endif %}</h1>
    <a href="/admin/products/" class="btn btn-secondary">Quay lại</a>
</div>

<div class="card">
    <form method="POST">
        {% csrf_token %}
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label>Tên sản phẩm <span style="color: red;">*</span></label>
                <input type="text" name="name" class="form-control" required value="{{ product.name|default:'' }}">
            </div>
            <div class="form-group">
                <label>SKU</label>
                <input type="text" name="sku" class="form-control" value="{{ product.sku|default:'' }}">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label>Danh mục <span style="color: red;">*</span></label>
                <select name="category_id" class="form-control" required>
                    <option value="">Chọn danh mục</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if product and product.category.id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Thương hiệu</label>
                <select name="brand_id" class="form-control">
                    <option value="">Chọn thương hiệu</option>
                    {% for brand in brands %}
                    <option value="{{ brand.id }}" {% if product and product.brand.id == brand.id %}selected{% endif %}>{{ brand.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label>Giá bán cơ bản (VND) <span style="color: red;">*</span></label>
                <input type="number" name="price" class="form-control" required min="0" value="{{ product.price|default:'' }}">
            </div>
            <div class="form-group">
                <label>Số lượng tồn kho (Tổng) <span style="color: red;">*</span></label>
                <input type="number" name="stock" class="form-control" required min="0" value="{{ product.stock|default:'' }}">
            </div>
        </div>

        <div class="form-group">
            <label>URL Hình ảnh</label>
            <input type="url" name="image_url" class="form-control" placeholder="https://..." value="{{ product.image_url|default:'' }}">
        </div>

        <div class="form-group">
            <label>Mô tả chi tiết</label>
            <textarea name="description" class="form-control" rows="5">{{ product.description|default:'' }}</textarea>
        </div>
        
        <div style="margin-top: 24px;">
            <button type="submit" class="btn btn-primary">Lưu Sản phẩm</button>
        </div>
    </form>
</div>

<!-- Phần Quản lý Variant sẽ được hiển thị khi sửa sản phẩm (Phase tiếp theo sẽ bổ sung Variant Form) -->
{% endblock %}
