{% extends "base.html" %}
{% block content %}
<div class="auth-page-wrapper auth-page-wrapper--compact">
    <div class="auth-card auth-card--compact" style="text-align:center;max-width:540px;">
        <div class="auth-logo">🔒</div>
        <h2 class="auth-title">Không có quyền truy cập</h2>
        <p class="auth-card-subtitle">
            {{ message|default:"Bạn không có quyền thực hiện thao tác này." }}
        </p>
        <div class="auth-role-hint">
            Nếu bạn đang đăng nhập sai vai trò, hãy chuyển sang đúng tab Khách hàng, Nhân viên hoặc Quản trị.
        </div>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px;">
            <a href="/login/" class="btn btn-primary">Đăng nhập lại</a>
            <a href="/" class="btn btn-secondary">Về trang chủ</a>
        </div>
    </div>
</div>
{% endblock %}
