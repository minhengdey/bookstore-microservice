services:
  product-db:
    image: postgres:15-alpine
    ports:
      - "55432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_PRODUCT:-product_db}
    volumes:
      - product_db_data:/var/lib/postgresql/data
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  cart-db:
    image: postgres:15-alpine
    ports:
      - "55433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_CART:-cart_db}
    volumes:
      - cart_db_data:/var/lib/postgresql/data
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:15-alpine
    ports:
      - "55434:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_ORDER:-order_db}
    volumes:
      - order_db_data:/var/lib/postgresql/data
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:15-alpine
    ports:
      - "55435:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_PAY:-pay_db}
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  shipping-db:
    image: postgres:15-alpine
    ports:
      - "55436:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_SHIP:-ship_db}
    volumes:
      - shipping_db_data:/var/lib/postgresql/data
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:15-alpine
    ports:
      - "55437:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_USER:-user_db}
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  recommender-db:
    image: postgres:15-alpine
    ports:
      - "55438:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_RECOMMENDER:-recommender_db}
    volumes:
      - recommender_db_data:/var/lib/postgresql/data
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_AUTH:-auth_db}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ── Identity / User services ──────────────────────────────────────────────
  auth-service:
    build: ./auth-service
    ports:
      - "${PORT_AUTH:-8012}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_AUTH:-auth-service-dev-key}
      - DB_NAME=${DB_NAME_AUTH:-auth_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=auth-db
      - DB_PORT=${DB_PORT_AUTH:-5432}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-bookstore-super-secret-jwt-2026}
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://user-service:8000}
      - AUTH_SERVICE_TIMEOUT=${AUTH_SERVICE_TIMEOUT:-5}
      - AUTH_CIRCUIT_FAIL_THRESHOLD=${AUTH_CIRCUIT_FAIL_THRESHOLD:-5}
      - AUTH_CIRCUIT_RESET_SECONDS=${AUTH_CIRCUIT_RESET_SECONDS:-30}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-internal-dev-token}
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:-internal-signing-secret}
      - INTERNAL_ALLOWED_SERVICES=${INTERNAL_ALLOWED_SERVICES:-auth-service}
      - INTERNAL_SIGNATURE_TOLERANCE=${INTERNAL_SIGNATURE_TOLERANCE:-30}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live/').read()\""]
      interval: 10s
      timeout: 3s
      retries: 5

  user-service:
    build: ./user-service
    ports:
      - "${PORT_USER:-8001}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_USER:-user-service-dev-key}
      - DB_NAME=${DB_NAME_USER:-user_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=user-db
      - DB_PORT=${DB_PORT:-5432}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-bookstore-super-secret-jwt-2026}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-internal-dev-token}
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:-internal-signing-secret}
      - INTERNAL_ALLOWED_SERVICES=${INTERNAL_ALLOWED_SERVICES:-auth-service}
      - INTERNAL_SIGNATURE_TOLERANCE=${INTERNAL_SIGNATURE_TOLERANCE:-30}
      - PYTHONPATH=/app/common
      - SERVICE_NAME=user-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,product-service,cart-service,shipping-service,user-service,recommender-ai-service
    depends_on:
      user-db:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - bookstore-net

  # ── Product service (Consolidated Catalog & Book) ────────────────────────
  product-service:
    build: ./product-service
    ports:
      - "${PORT_PRODUCT:-8002}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_PRODUCT:-product-service-dev-key}
      - DB_NAME=${DB_NAME_PRODUCT:-product_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=product-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - SERVICE_NAME=product-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,product-service,cart-service,shipping-service,user-service,recommender-ai-service
    depends_on:
      product-db:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - bookstore-net

  # ── Message Broker (Event-Driven Architecture) ────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s
    networks:
      - bookstore-net

  # ── Distributed Tracing (Jaeger) ──────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - bookstore-net

  # ── Redis Cache ───────────────────────────────────────────────────────────
  # ── Shopping services ─────────────────────────────────────────────────────
  cart-service:
    build: ./cart-service
    ports:
      - "${PORT_CART:-8003}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_CART:-cart-service-dev-key}
      - DB_NAME=${DB_NAME_CART:-cart_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=cart-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - SERVICE_NAME=cart-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,product-service,cart-service,shipping-service,user-service,recommender-ai-service
    depends_on:
      cart-db:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - bookstore-net

  order-service:
    build: ./order-service
    ports:
      - "${PORT_ORDER:-8007}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_ORDER:-order-service-dev-key}
      - DB_NAME=${DB_NAME_ORDER:-order_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=order-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - SERVICE_NAME=order-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,product-service,cart-service,shipping-service,user-service,recommender-ai-service
    depends_on:
      order-db:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - bookstore-net
  # ── Payment / Shipping services ───────────────────────────────────────────
  payment-service:
    build: ./payment-service
    ports:
      - "${PORT_PAY:-8008}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_PAY:-pay-service-dev-key}
      - DB_NAME=${DB_NAME_PAY:-pay_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=payment-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - SERVICE_NAME=payment-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,product-service,cart-service,shipping-service,user-service,recommender-ai-service
    depends_on:
      payment-db:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - bookstore-net

  payment-worker:
    build: ./payment-service
    command:
      - sh
      - -c
      - while true; do python manage.py retry_failed_shipping; sleep 60; done
    environment:
      - SECRET_KEY=${SECRET_KEY_PAY:-pay-service-dev-key}
      - DB_NAME=${DB_NAME_PAY:-pay_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=payment-db
      - DB_PORT=${DB_PORT:-5432}
      - SHIP_SERVICE_URL=http://shipping-service:8000
      - PYTHONPATH=/app/common
    depends_on:
      payment-db:
        condition: service_healthy
      payment-service:
        condition: service_started
    volumes:
      - ./common:/app/common
    networks:
      - bookstore-net

  shipping-service:
    build: ./shipping-service
    ports:
      - "${PORT_SHIP:-8009}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_SHIP:-ship-service-dev-key}
      - DB_NAME=${DB_NAME_SHIP:-ship_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=shipping-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - SERVICE_NAME=shipping-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,product-service,cart-service,shipping-service,user-service,recommender-ai-service
    depends_on:
      shipping-db:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - bookstore-net



  recommender-ai-service:
    build: ./recommender-ai-service
    ports:
      - "${PORT_RECOMMENDER:-8011}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_RECOMMENDER:-recommender-dev-key}
      - DB_NAME=${DB_NAME_RECOMMENDER:-recommender_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=recommender-db
      - DB_PORT=${DB_PORT:-5432}
      - ORDER_SERVICE_URL=http://order-service:8000
      - PRODUCT_SERVICE_URL=http://product-service:8000
      - IMPLICIT_CF_DATA_DIR=/app/data/implicit_cf
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-fast}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Neo4j Config
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - SERVICE_NAME=recommender-ai-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,product-service,cart-service,shipping-service,user-service,recommender-ai-service
    volumes:
      - ./recommender-ai-service/data:/app/data
      - ./recommender-ai-service/app/services/ai_engine/kb:/app/app/services/ai_engine/kb
    depends_on:
      recommender-db:
        condition: service_healthy
      neo4j:
        condition: service_started
    networks:
      - bookstore-net

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - ./neo4j_data:/data
    networks:
      - bookstore-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bookstore-net

  # ── True API Gateway (NGINX) ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - shipping-service
      - recommender-ai-service
      - api-gateway
    networks:
      - bookstore-net

  # ── Django API Gateway (BFF Layer) ────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    # Removed port mapping to host so only NGINX is exposed, keeping 8000 for local dev if needed
    ports:
      - "${PORT_GATEWAY:-8000}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_GATEWAY:-api-gateway-dev-key}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-bookstore-super-secret-jwt-2026}
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://user-service:8000}
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL:-http://product-service:8000}
      - CART_SERVICE_URL=${CART_SERVICE_URL:-http://cart-service:8000}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL:-http://order-service:8000}
      - PAY_SERVICE_URL=http://payment-service:8000
      - SHIP_SERVICE_URL=http://shipping-service:8000
      - RECOMMENDER_URL=${RECOMMENDER_URL:-http://recommender-ai-service:8000}
    networks:
      - bookstore-net

  # ── Workers & Consumers ─────────────────────────────────────────────────
  order-outbox-worker:
    build: ./order-service
    command: ["python", "manage.py", "relay_outbox"]
    environment:
      - SECRET_KEY=${SECRET_KEY_ORDER:-order-service-dev-key}
      - DB_NAME=${DB_NAME_ORDER:-order_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=order-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bookstore-net
    restart: unless-stopped
    volumes:
      - ./common:/app/common

  payment-consumer:
    build: ./payment-service
    command: ["python", "manage.py", "consume_orders"]
    environment:
      - SECRET_KEY=${SECRET_KEY_PAY:-pay-service-dev-key}
      - DB_NAME=${DB_NAME_PAY:-pay_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=payment-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bookstore-net
    restart: unless-stopped
    volumes:
      - ./common:/app/common

  payment-outbox-worker:
    build: ./payment-service
    command: ["python", "manage.py", "relay_outbox"]
    environment:
      - SECRET_KEY=${SECRET_KEY_PAY:-pay-service-dev-key}
      - DB_NAME=${DB_NAME_PAY:-pay_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=payment-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bookstore-net
    restart: unless-stopped
    volumes:
      - ./common:/app/common

networks:
  bookstore-net:
    driver: bridge

volumes:
  product_db_data:
  cart_db_data:
  order_db_data:
  payment_db_data:
  shipping_db_data:
  user_db_data:
  recommender_db_data:
  auth_db_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  redis_data:
  rabbitmq_data:
