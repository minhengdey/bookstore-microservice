services:

  # NOTE: Không dùng PostgreSQL container — kết nối tới PostgreSQL cài trên máy host.
  # Chạy scripts/init_databases.sql trong DBeaver/psql trước khi docker compose up.

  # ── Identity / User services ──────────────────────────────────────────────
  customer-service:
    build: ./customer-service
    ports:
      - "${PORT_CUSTOMER:-8001}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_CUSTOMER:-customer-service-dev-key}
      - DB_NAME=${DB_NAME_CUSTOMER:-customer_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-bookstore-super-secret-jwt-2026}
    networks:
      - bookstore-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  staff-service:
    build: ./staff-service
    ports:
      - "${PORT_STAFF:-8004}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_STAFF:-staff-service-dev-key}
      - DB_NAME=${DB_NAME_STAFF:-staff_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-bookstore-super-secret-jwt-2026}
    networks:
      - bookstore-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Product service (Consolidated Catalog & Book) ────────────────────────
  product-service:
    build: ./product-service
    ports:
      - "${PORT_PRODUCT:-8002}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_PRODUCT:-product-service-dev-key}
      - DB_NAME=${DB_NAME_PRODUCT:-product_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
    networks:
      - bookstore-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Shopping services ─────────────────────────────────────────────────────
  cart-service:
    build: ./cart-service
    ports:
      - "${PORT_CART:-8003}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_CART:-cart-service-dev-key}
      - DB_NAME=${DB_NAME_CART:-cart_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
    networks:
      - bookstore-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  order-service:
    build: ./order-service
    ports:
      - "${PORT_ORDER:-8007}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_ORDER:-order-service-dev-key}
      - DB_NAME=${DB_NAME_ORDER:-order_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
    networks:
      - bookstore-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Payment / Shipping services ───────────────────────────────────────────
  pay-service:
    build: ./pay-service
    ports:
      - "${PORT_PAY:-8008}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_PAY:-pay-service-dev-key}
      - DB_NAME=${DB_NAME_PAY:-pay_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
    networks:
      - bookstore-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ship-service:
    build: ./ship-service
    ports:
      - "${PORT_SHIP:-8009}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_SHIP:-ship-service-dev-key}
      - DB_NAME=${DB_NAME_SHIP:-ship_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
    networks:
      - bookstore-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Inventory management ──────────────────────────────────────────────────
  manager-service:
    build: ./manager-service
    ports:
      - "${PORT_MANAGER:-8005}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_MANAGER:-manager-service-dev-key}
      - DB_NAME=${DB_NAME_MANAGER:-manager_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
    networks:
      - bookstore-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Review / Recommendation ───────────────────────────────────────────────
  comment-rate-service:
    build: ./comment-rate-service
    ports:
      - "${PORT_COMMENT:-8010}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_COMMENT:-comment-rate-dev-key}
      - DB_NAME=${DB_NAME_COMMENT:-comment_rate_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
    networks:
      - bookstore-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  recommender-ai-service:
    build: ./recommender-ai-service
    ports:
      - "${PORT_RECOMMENDER:-8011}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_RECOMMENDER:-recommender-dev-key}
      - DB_NAME=${DB_NAME_RECOMMENDER:-recommender_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - ORDER_SERVICE_URL=http://order-service:8000
      - BOOK_SERVICE_URL=http://product-service:8000
      - IMPLICIT_CF_DATA_DIR=/app/data/implicit_cf
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-fast}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Neo4j Config
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
    volumes:
      - ./recommender-ai-service/data:/app/data
      - ./recommender-ai-service/app/services/ai_engine/kb:/app/app/services/ai_engine/kb
    networks:
      - bookstore-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - ./neo4j_data:/data
    networks:
      - bookstore-net

  # ── API Gateway ───────────────────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    ports:
      - "${PORT_GATEWAY:-8000}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_GATEWAY:-api-gateway-dev-key}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-bookstore-super-secret-jwt-2026}
      - CUSTOMER_SERVICE_URL=${CUSTOMER_SERVICE_URL:-http://customer-service:8000}
      - BOOK_SERVICE_URL=${BOOK_SERVICE_URL:-http://product-service:8000}
      - CATALOG_SERVICE_URL=${CATALOG_SERVICE_URL:-http://product-service:8000}
      - CART_SERVICE_URL=${CART_SERVICE_URL:-http://cart-service:8000}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL:-http://order-service:8000}
      - PAY_SERVICE_URL=${PAY_SERVICE_URL:-http://pay-service:8000}
      - SHIP_SERVICE_URL=${SHIP_SERVICE_URL:-http://ship-service:8000}
      - COMMENT_RATE_URL=${COMMENT_RATE_URL:-http://comment-rate-service:8000}
      - RECOMMENDER_URL=${RECOMMENDER_URL:-http://recommender-ai-service:8000}
      - STAFF_SERVICE_URL=${STAFF_SERVICE_URL:-http://staff-service:8000}
      - MANAGER_SERVICE_URL=${MANAGER_SERVICE_URL:-http://manager-service:8000}
    networks:
      - bookstore-net

networks:
  bookstore-net:
    driver: bridge
