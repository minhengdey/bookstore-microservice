services:
  catalog-db:
    image: postgres:15-alpine
    ports:
      - "55439:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_CATALOG:-catalog_db}
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
      - ./scripts/sql/02_catalog_db_seed.sql:/docker-entrypoint-initdb.d/02_catalog_db_seed.sql
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-db:
    image: postgres:15-alpine
    ports:
      - "55440:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_INVENTORY:-inventory_db}
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:15-alpine
    ports:
      - "55441:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_ORDER:-order_db}
    volumes:
      - order_db_data:/var/lib/postgresql/data
      - ./scripts/sql/06_order_db_seed.sql:/docker-entrypoint-initdb.d/06_order_db_seed.sql
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:15-alpine
    ports:
      - "55442:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_PAY:-pay_db}
    volumes:
      - payment_db_data:/var/lib/postgresql/data

    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:15-alpine
    ports:
      - "55443:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_NOTIFICATION:-notification_db}
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  interaction-db:
    image: postgres:15-alpine
    ports:
      - "55444:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_INTERACTION:-interaction_db}
    volumes:
      - interaction_db_data:/var/lib/postgresql/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  promotion-db:
    image: postgres:15-alpine
    ports:
      - "55445:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_PROMOTION:-promotion_db}
    volumes:
      - promotion_db_data:/var/lib/postgresql/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-db:
    image: postgres:15-alpine
    ports:
      - "55432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_PRODUCT:-product_db}
    volumes:
      - product_db_data:/var/lib/postgresql/data
      - ./scripts/sql/12_product_db_seed.sql:/docker-entrypoint-initdb.d/12_product_db_seed.sql
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  cart-db:
    image: postgres:15-alpine
    ports:
      - "55433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_CART:-cart_db}
    volumes:
      - cart_db_data:/var/lib/postgresql/data
      - ./scripts/sql/05_cart_db_seed.sql:/docker-entrypoint-initdb.d/05_cart_db_seed.sql
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


  shipping-db:
    image: postgres:15-alpine
    ports:
      - "55436:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_SHIP:-ship_db}
    volumes:
      - shipping_db_data:/var/lib/postgresql/data
      - ./scripts/sql/08_ship_db_seed.sql:/docker-entrypoint-initdb.d/08_ship_db_seed.sql
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:15-alpine
    ports:
      - "55437:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_USER:-user_db}
    volumes:
      - user_db_data:/var/lib/postgresql/data
      - ./scripts/sql/13_user_db_seed.sql:/docker-entrypoint-initdb.d/13_user_db_seed.sql
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  recommender-db:
    image: postgres:15-alpine
    ports:
      - "55438:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_RECOMMENDER:-recommender_db}
    volumes:
      - recommender_db_data:/var/lib/postgresql/data
      - ./scripts/sql/11_recommender_db_seed.sql:/docker-entrypoint-initdb.d/11_recommender_db_seed.sql
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME_AUTH:-auth_db}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      - ./scripts/sql/01_auth_db_seed.sql:/docker-entrypoint-initdb.d/01_auth_db_seed.sql
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ── Identity / User services ──────────────────────────────────────────────
  auth-service:
    build: ./auth-service
    ports:
      - "${PORT_AUTH:-8012}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_AUTH:-auth-service-dev-key}
      - DB_NAME=${DB_NAME_AUTH:-auth_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=auth-db
      - DB_PORT=${DB_PORT_AUTH:-5432}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ecommerce-super-secret-jwt-2026}
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://user-service:8000}
      - AUTH_SERVICE_TIMEOUT=${AUTH_SERVICE_TIMEOUT:-5}
      - AUTH_CIRCUIT_FAIL_THRESHOLD=${AUTH_CIRCUIT_FAIL_THRESHOLD:-5}
      - AUTH_CIRCUIT_RESET_SECONDS=${AUTH_CIRCUIT_RESET_SECONDS:-30}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-internal-dev-token}
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:-internal-signing-secret}
      - INTERNAL_ALLOWED_SERVICES=${INTERNAL_ALLOWED_SERVICES:-auth-service}
      - INTERNAL_SIGNATURE_TOLERANCE=${INTERNAL_SIGNATURE_TOLERANCE:-30}
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live/').read()\""]
      interval: 10s
      timeout: 3s
      retries: 5

  user-service:
    build: ./user-service
    ports:
      - "${PORT_USER:-8001}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_USER:-user-service-dev-key}
      - DB_NAME=${DB_NAME_USER:-user_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=user-db
      - DB_PORT=${DB_PORT:-5432}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ecommerce-super-secret-jwt-2026}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-internal-dev-token}
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:-internal-signing-secret}
      - INTERNAL_ALLOWED_SERVICES=${INTERNAL_ALLOWED_SERVICES:-auth-service}
      - INTERNAL_SIGNATURE_TOLERANCE=${INTERNAL_SIGNATURE_TOLERANCE:-30}
      - PYTHONPATH=/app/common
      - SERVICE_NAME=user-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,product-service,cart-service,shipping-service,user-service,recommender-ai-service,api-gateway
    depends_on:
      user-db:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - ecommerce-net

  # ── Catalog service ───────────────────────────────────────────────────────
  catalog-service:
    build: ./catalog-service
    ports:
      - "${PORT_CATALOG:-8010}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_CATALOG:-catalog-service-dev-key}
      - DB_NAME=${DB_NAME_CATALOG:-catalog_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=catalog-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - SERVICE_NAME=catalog-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,catalog-service,cart-service,shipping-service,user-service,recommender-ai-service
    depends_on:
      catalog-db:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - ecommerce-net

  # ── Inventory service ─────────────────────────────────────────────────────
  inventory-service:
    build: ./inventory-service
    ports:
      - "${PORT_INVENTORY:-8013}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_INVENTORY:-inventory-service-dev-key}
      - DB_NAME=${DB_NAME_INVENTORY:-inventory_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=inventory-db
      - DB_PORT=${DB_PORT:-5432}
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
      - PYTHONPATH=/app/common
      - SERVICE_NAME=inventory-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,catalog-service,inventory-service,cart-service,shipping-service,user-service,recommender-ai-service
      - RESERVATION_TTL_MINUTES=${RESERVATION_TTL_MINUTES:-15}
      - LOW_STOCK_THRESHOLD=${LOW_STOCK_THRESHOLD:-10}
    depends_on:
      inventory-db:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - ecommerce-net

  # ── Order service ─────────────────────────────────────────────────────────
  order-service:
    build: ./order-service
    ports:
      - "${PORT_ORDER:-8014}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_ORDER:-order-service-dev-key}
      - DB_NAME=${DB_NAME_ORDER:-order_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=order-db
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=redis://order-redis:6379/0
      - PYTHONPATH=/app/common
      - SERVICE_NAME=order-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,catalog-service,inventory-service,cart-service,shipping-service,user-service,recommender-ai-service
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-ecommerce_shared_secret}
      - CATALOG_SERVICE_URL=http://catalog-service:8000
      - PAYMENT_SERVICE_URL=http://payment-service:8000
    depends_on:
      order-db:
        condition: service_healthy
      order-redis:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - ecommerce-net

  # ── Payment service ───────────────────────────────────────────────────────
  payment-service:
    build: ./payment-service
    ports:
      - "${PORT_PAYMENT:-8015}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_PAY:-payment-service-dev-key}
      - DB_NAME=${DB_NAME_PAY:-pay_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=payment-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - SERVICE_NAME=payment-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,catalog-service,inventory-service,cart-service,shipping-service,user-service,recommender-ai-service
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-ecommerce_shared_secret}
      - PAYMENT_PROVIDER=MOCK
    depends_on:
      payment-db:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - ecommerce-net

  # ── Notification service ──────────────────────────────────────────────────
  notification-service:
    build: ./notification-service
    ports:
      - "${PORT_NOTIFICATION:-8016}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_NOTIFICATION:-notification-service-dev-key}
      - DB_NAME=${DB_NAME_NOTIFICATION:-notification_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=notification-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - SERVICE_NAME=notification-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,catalog-service,inventory-service,cart-service,shipping-service,user-service,recommender-ai-service,notification-service
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-ecommerce_shared_secret}
    depends_on:
      notification-db:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - ecommerce-net

  # ── Interaction service ───────────────────────────────────────────────────
  interaction-service:
    build: ./interaction-service
    ports:
      - "${PORT_INTERACTION:-8017}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_INTERACTION:-interaction-service-dev-key}
      - DB_NAME=${DB_NAME_INTERACTION:-interaction_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=interaction-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - SERVICE_NAME=interaction-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,catalog-service,inventory-service,cart-service,shipping-service,user-service,recommender-ai-service,notification-service,interaction-service,api-gateway
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-ecommerce_shared_secret}
    depends_on:
      interaction-db:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - ecommerce-net

  # ── Promotion service ─────────────────────────────────────────────────────
  promotion-service:
    build: ./promotion-service
    ports:
      - "${PORT_PROMOTION:-8018}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_PROMOTION:-promotion-service-dev-key}
      - DB_NAME=${DB_NAME_PROMOTION:-promotion_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=promotion-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - SERVICE_NAME=promotion-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,catalog-service,inventory-service,cart-service,shipping-service,user-service,recommender-ai-service,notification-service,interaction-service,promotion-service,api-gateway
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-ecommerce_shared_secret}
    depends_on:
      promotion-db:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - ecommerce-net

  # ── Product service (Consolidated Catalog & Product) ────────────────────────
  product-service:
    build: ./product-service
    ports:
      - "${PORT_PRODUCT:-8002}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_PRODUCT:-product-service-dev-key}
      - DB_NAME=${DB_NAME_PRODUCT:-product_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=product-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - SERVICE_NAME=product-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,product-service,cart-service,shipping-service,user-service,recommender-ai-service
    depends_on:
      product-db:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - ecommerce-net

  # ── Message Broker (Event-Driven Architecture) ────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 180s
    networks:
      - ecommerce-net

  # ── Distributed Tracing (Jaeger) ──────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - ecommerce-net

  # ── Redis Cache ───────────────────────────────────────────────────────────
  # ── Shopping services ─────────────────────────────────────────────────────
  cart-service:
    build: ./cart-service
    ports:
      - "${PORT_CART:-8003}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_CART:-cart-service-dev-key}
      - DB_NAME=${DB_NAME_CART:-cart_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=cart-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - SERVICE_NAME=cart-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,product-service,cart-service,shipping-service,user-service,recommender-ai-service
    depends_on:
      cart-db:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - ecommerce-net


  payment-worker:
    build: ./payment-service
    command:
      - sh
      - -c
      - while true; do python manage.py retry_failed_shipping; sleep 60; done
    environment:
      - SECRET_KEY=${SECRET_KEY_PAY:-pay-service-dev-key}
      - DB_NAME=${DB_NAME_PAY:-pay_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=payment-db
      - DB_PORT=${DB_PORT:-5432}
      - SHIP_SERVICE_URL=http://shipping-service:8000
      - PYTHONPATH=/app/common
    depends_on:
      payment-db:
        condition: service_healthy
      payment-service:
        condition: service_started
    volumes:
      - ./common:/app/common
    networks:
      - ecommerce-net

  shipping-service:
    build: ./shipping-service
    ports:
      - "${PORT_SHIP:-8009}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_SHIP:-ship-service-dev-key}
      - DB_NAME=${DB_NAME_SHIP:-ship_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=shipping-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - SERVICE_NAME=shipping-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,product-service,cart-service,shipping-service,user-service,recommender-ai-service
    depends_on:
      shipping-db:
        condition: service_healthy
    volumes:
      - ./common:/app/common
    networks:
      - ecommerce-net



  recommender-ai-service:
    build: ./recommender-ai-service
    ports:
      - "${PORT_RECOMMENDER:-8011}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_RECOMMENDER:-recommender-dev-key}
      - DB_NAME=${DB_NAME_RECOMMENDER:-recommender_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=recommender-db
      - DB_PORT=${DB_PORT:-5432}
      - ORDER_SERVICE_URL=http://order-service:8000
      - PRODUCT_SERVICE_URL=http://product-service:8000
      - IMPLICIT_CF_DATA_DIR=/app/data/implicit_cf
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-fast}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Neo4j Config
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - SERVICE_NAME=recommender-ai-service
      - INTERNAL_ALLOWED_SERVICES=auth-service,order-service,payment-service,product-service,cart-service,shipping-service,user-service,recommender-ai-service
    volumes:
      - ./recommender-ai-service/data:/app/data
      - ./recommender-ai-service/app/services/ai_engine/kb:/app/app/services/ai_engine/kb
    depends_on:
      recommender-db:
        condition: service_healthy
      neo4j:
        condition: service_started
    networks:
      - ecommerce-net

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - ./neo4j_data:/data
    networks:
      - ecommerce-net

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-net

  # ── True API Gateway (NGINX) ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - catalog-service
      - inventory-service
      - order-service
      - payment-service
      - notification-service
      - interaction-service
      - product-service
      - cart-service
      - shipping-service
      - recommender-ai-service
      - promotion-service
      - api-gateway
    networks:
      - ecommerce-net

  # ── Django API Gateway (BFF Layer) ────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    # Removed port mapping to host so only NGINX is exposed, keeping 8000 for local dev if needed
    ports:
      - "${PORT_GATEWAY:-8000}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY_GATEWAY:-api-gateway-dev-key}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ecommerce-super-secret-jwt-2026}
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://user-service:8000}
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL:-http://product-service:8000}
      - CART_SERVICE_URL=${CART_SERVICE_URL:-http://cart-service:8000}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL:-http://order-service:8000}
      - PAY_SERVICE_URL=http://payment-service:8000
      - SHIP_SERVICE_URL=http://shipping-service:8000
      - RECOMMENDER_URL=${RECOMMENDER_URL:-http://recommender-ai-service:8000}
      - PROMOTION_SERVICE_URL=http://promotion-service:8000
      - INTERACTION_SERVICE_URL=http://interaction-service:8000
      - AUTH_SERVICE_URL=http://auth-service:8000
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-internal-dev-token}
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET:-internal-signing-secret}
      - SERVICE_NAME=api-gateway
    networks:
      - ecommerce-net

  # ── Workers & Consumers ─────────────────────────────────────────────────
  order-outbox-worker:
    build: ./order-service
    command: ["python", "manage.py", "relay_outbox"]
    environment:
      - SECRET_KEY=${SECRET_KEY_ORDER:-order-service-dev-key}
      - DB_NAME=${DB_NAME_ORDER:-order_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=order-db
      - DB_PORT=${DB_PORT:-5432}
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
      - PYTHONPATH=/app/common
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net
    restart: unless-stopped
    volumes:
      - ./common:/app/common

  inventory-outbox-worker:
    build: ./inventory-service
    command: ["python", "manage.py", "relay_outbox"]
    environment:
      - SECRET_KEY=${SECRET_KEY_INVENTORY:-inventory-service-dev-key}
      - DB_NAME=${DB_NAME_INVENTORY:-inventory_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=inventory-db
      - DB_PORT=${DB_PORT:-5432}
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
      - PYTHONPATH=/app/common
    depends_on:
      inventory-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net
    restart: unless-stopped
    volumes:
      - ./common:/app/common

  inventory-order-consumer:
    build: ./inventory-service
    command: ["python", "manage.py", "consume_order_events"]
    environment:
      - SECRET_KEY=${SECRET_KEY_INVENTORY:-inventory-service-dev-key}
      - DB_NAME=${DB_NAME_INVENTORY:-inventory_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=inventory-db
      - DB_PORT=${DB_PORT:-5432}
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
      - RESERVATION_TTL_MINUTES=${RESERVATION_TTL_MINUTES:-15}
      - PYTHONPATH=/app/common
    depends_on:
      inventory-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net
    restart: unless-stopped
    volumes:
      - ./common:/app/common

  order-consumer:
    build: ./order-service
    command: ["python", "manage.py", "consume_events"]
    environment:
      - SECRET_KEY=${SECRET_KEY_ORDER:-order-service-dev-key}
      - DB_NAME=${DB_NAME_ORDER:-order_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=order-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net
    restart: unless-stopped
    volumes:
      - ./common:/app/common

  interaction-outbox-worker:
    build: ./interaction-service
    command: ["python", "manage.py", "relay_outbox"]
    environment:
      - SECRET_KEY=${SECRET_KEY_INTERACTION:-interaction-service-dev-key}
      - DB_NAME=${DB_NAME_INTERACTION:-interaction_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=interaction-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
    depends_on:
      interaction-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net
    restart: unless-stopped
    volumes:
      - ./common:/app/common

  payment-consumer:
    build: ./payment-service
    command: ["python", "manage.py", "consume_orders"]
    environment:
      - SECRET_KEY=${SECRET_KEY_PAY:-pay-service-dev-key}
      - DB_NAME=${DB_NAME_PAY:-pay_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=payment-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net
    restart: unless-stopped
    volumes:
      - ./common:/app/common

  payment-outbox-worker:
    build: ./payment-service
    command: ["python", "manage.py", "relay_outbox"]
    environment:
      - SECRET_KEY=${SECRET_KEY_PAY:-pay-service-dev-key}
      - DB_NAME=${DB_NAME_PAY:-pay_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=payment-db
      - DB_PORT=${DB_PORT:-5432}
      - PYTHONPATH=/app/common
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net
    restart: unless-stopped
    volumes:
      - ./common:/app/common

  dlq-consumer:
    build: ./payment-service
    command: ["python", "manage.py", "consume_dlq"]
    environment:
      - SECRET_KEY=${SECRET_KEY_PAY:-pay-service-dev-key}
      - DB_NAME=${DB_NAME_PAY:-pay_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=payment-db
      - DB_PORT=${DB_PORT:-5432}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:-user}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-password}
      - PYTHONPATH=/app/common
      - SERVICE_NAME=dlq-consumer
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net
    restart: unless-stopped
    volumes:
      - ./common:/app/common

  recommender-consumer:
    build: ./recommender-ai-service
    command: ["python", "manage.py", "consume_events"]
    environment:
      - SECRET_KEY=${SECRET_KEY_RECOMMENDER:-recommender-dev-key}
      - DB_NAME=${DB_NAME_RECOMMENDER:-recommender_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=recommender-db
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
      - MODEL_SERVING_URL=http://model-serving-service:8000
      - PYTHONPATH=/app/common
    depends_on:
      recommender-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net
    restart: unless-stopped
    volumes:
      - ./recommender-ai-service/app/services/ai_engine/kb:/app/app/services/ai_engine/kb
      - ./recommender-ai-service/data:/app/data

  # ── Model Serving service ────────────────────────────────────────────────
  model-serving-service:
    build: ./model-serving-service
    ports:
      - "${PORT_MODEL_SERVING:-8019}:8000"
    networks:
      - ecommerce-net
    restart: unless-stopped
    # In a real environment, you might add:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  ecommerce-net:
    driver: bridge

volumes:
  catalog_db_data:
  inventory_db_data:
  cart_db_data:
  order_db_data:
  payment_db_data:
  notification_db_data:
  interaction_db_data:
  promotion_db_data:
  product_db_data:
  shipping_db_data:
  user_db_data:
  recommender_db_data:
  auth_db_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  redis_data:
  rabbitmq_data:
