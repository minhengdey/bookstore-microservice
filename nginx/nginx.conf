worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Upstreams with keepalive to reuse connections (reduce TCP/TLS handshake latency)
    upstream api_gateway_upstream {
        server api-gateway:8000;
        keepalive 16;
    }

    upstream auth_service_upstream {
        server auth-service:8000;
        keepalive 8;
    }

    # Cache setup for auth
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=auth_cache:10m max_size=100m inactive=60m use_temp_path=off;

    # Performance / proxy tuning
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;

    # Limit zones
    limit_req_zone $binary_remote_addr zone=public_api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_api:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=critical_api:10m rate=10r/s;

    # Timeouts
    proxy_read_timeout 60s;
    proxy_connect_timeout 15s;
    proxy_send_timeout 60s;

    # Buffer settings for better performance
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Keep connections alive
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Global security: strip spoof headers
    map $http_x_request_id $request_id_or_new {
        default $http_x_request_id;
        ""      $request_id;
    }

    server {
        listen 80;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;";

        # Strip incoming spoof headers globally
        proxy_set_header X-User-Id "";
        proxy_set_header X-Role "";
        proxy_set_header X-Roles "";
        proxy_set_header X-Username "";
        proxy_set_header X-User-Status "";
        proxy_set_header X-Role-Version "";
        proxy_set_header X-Entity-Id "";
        
        # Inject standard Request-Id and Trace-Id
        proxy_set_header X-Request-Id $request_id_or_new;
        proxy_set_header X-Trace-Id $request_id_or_new;

        # Block all internal routes entirely
        location ~* /internal/ {
            return 403;
        }

        # Internal Auth verification endpoint
        location = /auth_verify {
            internal;
            proxy_pass http://auth-service:8000/auth/introspect/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;

            # Cache auth results for 5s to reduce load
            proxy_cache auth_cache;
            proxy_cache_valid 200 204 5s;
            proxy_cache_key "$http_authorization";
        }

        # Auth APIs (siết mạnh)
        location ~* ^/auth/ {
            limit_req zone=auth_api burst=5 nodelay;
            proxy_pass http://auth-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect ~^http://auth-service:8000(.*?)$ $scheme://$host$1;
        }

        # User REST APIs only — /profile/ is HTML on api-gateway, not user-service
        location ~* ^/users/ {
            auth_request /auth_verify;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $roles $upstream_http_x_roles;
            auth_request_set $username $upstream_http_x_username;
            auth_request_set $user_status $upstream_http_x_user_status;
            auth_request_set $role_version $upstream_http_x_role_version;
            
            proxy_pass http://user-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-Roles $roles;
            proxy_set_header X-Username $username;
            proxy_set_header X-User-Status $user_status;
            proxy_set_header X-Role-Version $role_version;
            proxy_redirect ~^http://user-service:8000(.*?)$ $scheme://$host$1;
        }

        # Inventory APIs
        location ~* ^/(warehouse|inventory)/ {
            limit_req zone=public_api burst=20 nodelay;
            proxy_pass http://api_gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect ~^http://api-gateway:8000(.*?)$ $scheme://$host$1;
        }

        # Critical APIs (rất chặt)
        # auth_request chỉ hoạt động với Bearer token (REST API).
        # Với HTML browser dùng session cookie, auth được xử lý bởi api-gateway middleware.
        location ~* ^/(orders|payment|checkout)/ {
            limit_req zone=critical_api burst=20 nodelay;
            proxy_pass http://api_gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect ~^http://api-gateway:8000(.*?)$ $scheme://$host$1;
        }

        # Public APIs (thoáng)
        location ~* ^/(products|categories|promotions)/ {
            limit_req zone=public_api burst=50 nodelay;
            proxy_pass http://api_gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect ~^http://api-gateway:8000(.*?)$ $scheme://$host$1;
        }

        # Default catch-all
        location / {
            limit_req zone=public_api burst=50 nodelay;
            proxy_pass http://api_gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect ~^http://api-gateway:8000(.*?)$ $scheme://$host$1;
        }
    }
}
